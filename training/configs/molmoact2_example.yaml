# Sample --config-file for --policy-type molmoact2 (LoRA -- fits on one
# modern GPU, ~20GB at batch 8). See training/configs/molmoact2_fft_example.yaml
# for the full-finetune/FSDP2 shape instead.
#
#   python -m training.train --tasks dress_the_teddy_bear --dataset-source abc130k \
#       --policy-type molmoact2 --config-file training/configs/molmoact2_example.yaml
#
# setup_type/control_mode are REQUIRED for molmoact2 (either here or via
# --molmoact2-setup-type/--molmoact2-control-mode) -- free-text prompts fed
# into MolmoAct2's VLM describing this robot's embodiment/control
# convention, not guessable defaults. --tasks/--policy-type are still
# required on the command line -- see training/README.md's "Config files"
# section.

train:
  num_epochs: 3
  batch_size: 8
  eval_every_steps: 200

model:
  type: molmoact2
  checkpoint_path: allenai/MolmoAct2
  setup_type: "dual-arm robot with wrist and top cameras"
  control_mode: "delta joint position"
  action_mode: continuous
  train_mode: lora          # lora (this file) | fft | freeze
  lora_rank: 64
  lora_alpha: 16
  lora_dropout: 0.05
  gradient_checkpointing: true
